[workspace]
resolver = "2"
members = [
    "proteus-ai",
    "proteus-engine",
    "proteus-core",
    "proteus-gui",
    "proteus-cli",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["mx57"]

[workspace.dependencies.proteus-ai]
path = "proteus-ai"

[workspace.dependencies.proteus-engine]
path = "proteus-engine"

[workspace.dependencies.proteus-core]
path = "proteus-core"

[workspace.dependencies.proteus-gui]
path = "proteus-gui"
